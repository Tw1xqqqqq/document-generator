services:
  # PHP-приложение (Laravel API)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      # Адрес сервиса конвертации внутри сети Docker
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      - gotenberg

  # Веб-сервер: отдаёт React и проксирует /api в app
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - app

  # Конвертация docx -> pdf (внутри LibreOffice)
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--api-timeout=120s"
