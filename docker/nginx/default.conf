server {
    listen 80;
    server_name _;

    # Документы бывают большими - разрешаем загрузку до 32 МБ
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы к API уходят в PHP-контейнер.
    # Все маршруты Laravel обрабатывает один файл public/index.php,
    # поэтому SCRIPT_FILENAME задан жёстко.
    location ~ ^/(api|storage)/ {
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
    }

    # Всё остальное - React. Неизвестные пути отдаём index.html,
    # чтобы работала навигация на стороне клиента.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
